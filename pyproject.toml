[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mlx-whisper-vocamac"
version = "0.1.0"
description = "Loopback-only MLX Whisper large-v3-turbo endpoint for VocaMac"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.116,<1",
  "mlx-whisper==0.4.3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.14,<1",
]

[project.scripts]
mlx-whisper-vocamac = "mlx_whisper_vocamac.cli:main"
mlx-whisper-vocamac-agent = "mlx_whisper_vocamac.launch_agent:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_whisper_vocamac"]
